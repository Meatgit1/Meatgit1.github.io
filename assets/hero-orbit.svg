    <ellipse cx="331" cy="324" rx="247" ry="134" stroke-opacity=".4"/>
    <ellipse cx="331" cy="324" rx="184" ry="97" stroke-opacity=".22"/>
    <ellipse cx="331" cy="324" rx="119" ry="62" stroke-opacity=".2"/>
  </g>
  <ellipse cx="331" cy="324" rx="241" ry="150" transform="rotate(26 331 324)" stroke="#b7d8ce" stroke-opacity=".13" stroke-dasharray="3 8"/>
  <path d="M74 492C176 528 417 471 501 324c40-71 13-145-78-162" stroke="#9bd2ca" stroke-opacity=".2" stroke-width="1"/>
