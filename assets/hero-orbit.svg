    <path d="m474 164 0 60-70 0z" fill="#f5f2e9" fill-opacity=".25"/>
    <path d="m474 174 59 50-59 50-59-50z" stroke="#fff9e4" stroke-opacity=".2" stroke-dasharray="2 4"/>
    <circle cx="474" cy="224" r="4" fill="#102e3b" stroke="#e0e9d8" stroke-width="1.5"/>
