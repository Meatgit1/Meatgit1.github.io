    <path d="m356 281 4 0-2 4m20 12 4 0-2 4m19 12 4 0-2 4"/>
  </g>
  <circle cx="260" cy="352" r="29" fill="url(#sun)"/>
  <circle cx="260" cy="352" r="35" stroke="#e6ac80" stroke-opacity=".35"/>
  <circle cx="260" cy="352" r="44" stroke="#e6ac80" stroke-opacity=".13"/>
