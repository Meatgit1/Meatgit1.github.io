    <text x="44" y="597">ILLUSTRATIVE GEOMETRY</text>
    <text x="543" y="597">NOT TO SCALE</text>
  </g>
  <circle cx="260" cy="352" r="180" fill="url(#glow)"/>
  <g transform="rotate(-27 331 324)" stroke="#94bfbb">
