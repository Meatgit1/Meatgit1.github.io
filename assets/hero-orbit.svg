<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative solar-sail orbital geometry</title>
  <desc id="desc">Original orbital ellipses surround a warm sun. An abstract reflective sail follows a curved path. This conceptual illustration contains no mission trajectory data.</desc>
  <defs>
    <radialGradient id="space" cx=".44" cy=".48" r=".74">
      <stop stop-color="#1c4451"/>
      <stop offset="1" stop-color="#102e3b"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop stop-color="#cf542d" stop-opacity=".28"/>
      <stop offset=".38" stop-color="#cf542d" stop-opacity=".08"/>
      <stop offset="1" stop-color="#cf542d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx=".34" cy=".28" r=".8">
      <stop stop-color="#ffe6ad"/>
      <stop offset=".6" stop-color="#efa26b"/>
      <stop offset="1" stop-color="#cf542d"/>
    </radialGradient>
    <linearGradient id="sail" x1="411" y1="185" x2="530" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#faf7e9"/>
      <stop offset=".52" stop-color="#b7dbd0"/>
      <stop offset="1" stop-color="#648f93"/>
    </linearGradient>
    <linearGradient id="flight" x1="129" y1="469" x2="474" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9bd2ca" stop-opacity="0"/>
      <stop offset=".35" stop-color="#9bd2ca" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f5f2e9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 7 4 1 7" stroke="#cf542d" stroke-width="1.1" fill="none"/>
    </marker>
  </defs>
  <path fill="url(#space)" d="M0 0h680v620H0z"/>
  <g stroke="#9bd2ca" stroke-opacity=".075" stroke-width="1">
    <path d="M56 0v620M188 0v620M320 0v620M452 0v620M584 0v620"/>
    <path d="M0 92h680M0 224h680M0 356h680M0 488h680"/>
  </g>
  <path d="M44 48h28M44 48v28M636 48h-28M636 48v28M44 572h28M44 572v-28M636 572h-28M636 572v-28" stroke="#9bd2ca" stroke-opacity=".42"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="2" fill="#a4bfc0">
