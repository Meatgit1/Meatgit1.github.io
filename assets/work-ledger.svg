      <text x="255" y="188" font-size="10" font-weight="600">Keep the familiar sequence.</text>
      <path d="M255 201h223" stroke="#102e3b" stroke-opacity=".12"/>
      <rect x="255" y="217" width="83" height="26" rx="4" fill="#9bd2ca"/>
