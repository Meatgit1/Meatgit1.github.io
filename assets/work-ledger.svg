<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="ledger-title ledger-desc">
  <title id="ledger-title">Heera Hisab — an offline ledger workflow</title>
  <desc id="ledger-desc">An original interface sketch showing ordered entry, local draft review, and a report. All visible content is illustrative and contains no personal or financial records.</desc>
  <defs>
    <pattern id="ledger-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#102e3b" stroke-opacity=".045"/>
    </pattern>
    <filter id="ledger-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#102e3b" flood-opacity=".09"/>
    </filter>
    <marker id="ledger-arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="m1 1 4 2.5L1 6" fill="none" stroke="#102e3b" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="800" height="460" fill="#f5f2e9"/>
  <rect width="800" height="460" fill="url(#ledger-grid)"/>
  <circle cx="741" cy="53" r="76" fill="#9bd2ca" opacity=".22"/>
  <path d="M25 386h87M25 398h53" stroke="#cf542d" stroke-width="2" opacity=".55"/>
