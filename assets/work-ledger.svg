      <text x="619" y="299" text-anchor="middle" font-size="9.5" font-weight="600">Open monthly report</text>

      <path d="M239 341h485" stroke="#102e3b" stroke-opacity=".1"/>
      <text x="241" y="361" font-size="9" fill="#586f76">Gujarati / English</text>
      <text x="724" y="361" text-anchor="end" font-size="9" fill="#586f76">Familiar inputs. Reviewable results.</text>
