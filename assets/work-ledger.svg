      <rect x="346" y="217" width="82" height="26" rx="4" fill="#102e3b" fill-opacity=".08"/>
      <text x="387" y="234" text-anchor="middle" font-size="10">Category B</text>
      <rect x="255" y="251" width="83" height="26" rx="4" fill="#cf542d" fill-opacity=".13"/>
      <text x="296.5" y="268" text-anchor="middle" font-size="10" fill="#a64325">Category C</text>
      <rect x="346" y="251" width="82" height="26" rx="4" fill="#9bd2ca" fill-opacity=".52"/>
      <text x="387" y="268" text-anchor="middle" font-size="10">Category A</text>
      <path d="M255 298h104m11 0h40" stroke="#102e3b" stroke-width="3" stroke-linecap="round" opacity=".12"/>
      <path d="M451 229h26m-5-5 5 5-5 5" fill="none" stroke="#cf542d" stroke-width="1.5"/>

      <text x="517" y="149" font-size="9" letter-spacing="1.4" opacity=".58">REVIEW AT A GLANCE</text>
      <rect x="514" y="163" width="210" height="160" rx="6" fill="#102e3b"/>
      <rect x="531" y="182" width="23" height="23" rx="5" fill="#9bd2ca"/>
      <path d="m537 193 4 4 7-8" fill="none" stroke="#102e3b" stroke-width="1.6"/>
      <text x="565" y="198" fill="#f5f2e9" font-size="11" font-weight="600">Review before save</text>
      <path d="M531 219h176" stroke="#f5f2e9" stroke-opacity=".18"/>
      <text x="531" y="241" fill="#f5f2e9" font-size="9.5" opacity=".7">Entry sequence</text>
      <text x="707" y="241" text-anchor="end" fill="#9bd2ca" font-size="9.5">Preserved</text>
      <text x="531" y="264" fill="#f5f2e9" font-size="9.5" opacity=".7">Working draft</text>
      <text x="707" y="264" text-anchor="end" fill="#9bd2ca" font-size="9.5">Local</text>
