<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">From operator intent to ground software</title>
  <desc id="desc">An original conceptual workflow showing operator input, checks, interface definitions and ground software, connected by a telemetry feedback loop. It does not reproduce an operational system.</desc>
