<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Solar-sail research method illustration</title>
  <desc id="desc">A conceptual sun-to-sail steering schematic above a three-stage sequence: evolutionary search, local refinement, and independent checks. The diagram is illustrative and contains no research results.</desc>
  <defs>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" stroke="#102e3b" stroke-opacity=".055"/>
    </pattern>
    <radialGradient id="sun">
      <stop stop-color="#f4b16d"/>
      <stop offset="1" stop-color="#cf542d"/>
    </radialGradient>
    <linearGradient id="panel" x1="382" y1="86" x2="523" y2="242" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d3ece1"/>
      <stop offset=".5" stop-color="#9bd2ca"/>
      <stop offset="1" stop-color="#6e9da2"/>
    </linearGradient>
    <marker id="navy-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="m1 1 6 3-6 3" stroke="#102e3b" stroke-width="1.1" fill="none"/>
    </marker>
    <marker id="orange-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="m1 1 6 3-6 3" stroke="#cf542d" stroke-width="1.1" fill="none"/>
    </marker>
  </defs>
  <path fill="#f5f2e9" d="M0 0h800v460H0z"/>
  <path fill="url(#grid)" d="M0 0h800v460H0z"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.8" fill="#5b747a">
    <text x="36" y="33">RESEARCH / SOLAR-SAIL GUIDANCE</text>
    <text x="598" y="33">CONCEPT SCHEMATIC</text>
  </g>
  <path d="M35 50h730" stroke="#102e3b" stroke-opacity=".16"/>
  <path d="M42 279c110-122 249-164 377-125s235 47 344-39" stroke="#102e3b" stroke-opacity=".11" stroke-width="1.3"/>
  <path d="M42 296c110-122 249-164 377-125s235 47 344-39" stroke="#102e3b" stroke-opacity=".07" stroke-dasharray="4 6"/>
  <circle cx="150" cy="179" r="62" fill="#cf542d" fill-opacity=".04"/>
