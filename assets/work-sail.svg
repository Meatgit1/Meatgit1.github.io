    <text x="121" y="381">search</text>
    <text x="381" y="361">Local</text>
    <text x="381" y="381">refinement</text>
    <text x="641" y="361">Independent</text>
    <text x="641" y="381">checks</text>
  </g>
  <path d="M259 366h32m228 0h32" stroke="#8b9d9c" marker-end="url(#navy-arrow)"/>
  <g fill="#6e8387" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1.2">
